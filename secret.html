<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>are you a femboy?</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    .card {
      text-align: center;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 90%;
    }

    .question {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 2.5rem;
      line-height: 1.2;
    }

    .question span {
      color: #ff6eb4;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    button {
      padding: 0.85rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.1s ease;
      letter-spacing: 0.01em;
    }

    button:active { transform: scale(0.96); }

    .btn-yes {
      background: #ff6eb4;
      color: #fff;
    }

    .btn-no {
      background: #222;
      color: #888;
      border: 1.5px solid #333;
    }

    .btn-yes:hover { opacity: 0.88; }
    .btn-no:hover { background: #2a2a2a; color: #aaa; }

    .answer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
    }

    .answer.show { display: flex; }

    .emoji {
      font-size: 4rem;
      animation: pop 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
    }

    @keyframes pop {
      from { transform: scale(0.4); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .answer-text {
      font-size: clamp(2rem, 6vw, 3.2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .answer-text.yes  { color: #ff6eb4; }
    .answer-text.no   { color: #e05555; }

    .back {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #555;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .back:hover { color: #888; }

    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .card { position: relative; z-index: 1; }

    canvas { display: block; }
  </style>
</head>
<body>

<canvas class="particles" id="bg"></canvas>

<div class="card">
  <div id="quiz">
    <p class="question">bist du ein <span>femboy?</span></p>
    <div class="buttons">
      <button class="btn-yes" onclick="answer('yes')">yes</button>
      <button class="btn-no"  onclick="answer('no')">no</button>
    </div>
  </div>

  <div class="answer" id="result">
    <div class="emoji" id="emoji"></div>
    <div class="answer-text" id="answer-text"></div>
    <button class="back" onclick="reset()">↩ nochmal</button>
  </div>
</div>

<script>
  function answer(val) {
    document.getElementById('quiz').style.display = 'none';
    const r = document.getElementById('result');
    r.classList.add('show');
    if (val === 'yes') {
      document.getElementById('emoji').textContent = '🩷';
      const t = document.getElementById('answer-text');
      t.textContent = 'thanks ♡';
      t.className = 'answer-text yes';
    } else {
      document.getElementById('emoji').textContent = '💢';
      const t = document.getElementById('answer-text');
      t.textContent = 'fuck you';
      t.className = 'answer-text no';
    }
  }

  function reset() {
    document.getElementById('quiz').style.display = '';
    const r = document.getElementById('result');
    r.classList.remove('show');
    document.getElementById('emoji').textContent = '';
  }

  // subtle floating particles
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H, dots = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeDot() {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + 0.4,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      a: Math.random() * 0.4 + 0.1
    };
  }

  resize();
  for (let i = 0; i < 80; i++) dots.push(makeDot());
  window.addEventListener('resize', resize);

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const d of dots) {
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0) d.x = W;
      if (d.x > W) d.x = 0;
      if (d.y < 0) d.y = H;
      if (d.y > H) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,110,180,${d.a})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
